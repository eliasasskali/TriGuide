name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  dead-code-analysis:
    name: Dead Code Analysis
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery
      
      - name: Get changed Swift files
        id: changed-files
        run: |
          # Get list of changed Swift files in this PR
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.swift$' || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Count changed files
          if [ -z "$CHANGED_FILES" ]; then
            echo "has_swift_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_swift_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Run Periphery
        if: steps.changed-files.outputs.has_swift_changes == 'true'
        id: periphery
        continue-on-error: true
        run: |
          # Run periphery and save output
          periphery scan --config periphery.yml > periphery_output.txt 2>&1 || true
          
          # Filter results to only show issues in changed files
          CHANGED_FILES="${{ steps.changed-files.outputs.changed_files }}"
          
          # Create filtered output
          > filtered_periphery_output.txt
          
          # Extract just the warning lines (ignore other output)
          grep "warning:" periphery_output.txt > warnings_only.txt || true
          
          while IFS= read -r line; do
            for file in $CHANGED_FILES; do
              # Match on just the filename, since paths might differ
              filename=$(basename "$file")
              if echo "$line" | grep -q "$filename"; then
                echo "$line" >> filtered_periphery_output.txt
                break
              fi
            done
          done < warnings_only.txt
          
          # Check if any dead code was found
          if [ -s filtered_periphery_output.txt ]; then
            echo "dead_code_found=true" >> $GITHUB_OUTPUT
            echo "Dead code found in changed files:"
            cat filtered_periphery_output.txt
          else
            echo "dead_code_found=false" >> $GITHUB_OUTPUT
            echo "No dead code found in changed files"
          fi
      
      - name: Comment on PR with dead code findings
        if: steps.periphery.outputs.dead_code_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('filtered_periphery_output.txt', 'utf8');
            
            const body = `## ⚠️ Dead Code Detected
            
            Periphery found unused code in the files you modified:
            
            \`\`\`
            ${output}
            \`\`\`
            
            Please review and remove any dead code before merging.`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Dead Code Detected')
            );
            
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  tests:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Build and Test
        run: |
          xcodebuild test \
            -project TriGuide.xcodeproj \
            -scheme TriGuide \
            -testPlan TestPlan \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/Logs/Test/*.xcresult
